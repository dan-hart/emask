[package]
name = "emask"
version = "0.1.0"
edition = "2021"
description = "Superfast CLI that mints masked email addresses (Fastmail, DuckDuckGo) and copies them to your clipboard"
license = "AGPL-3.0-or-later"
repository = "https://github.com/dan-hart/emask"
readme = "README.md"
keywords = ["email", "privacy", "fastmail", "duckduckgo", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "emask"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = "3"
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
dirs = "6"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
zeroize = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
